# Vets the policy trained in phase 1 (results/uplift_synthetic_v1/policy.joblib)
# against synthetic logged-bandit data generated by a *different*, non-uniform
# logging policy (see ope/simulate.py) -- exactly the "should I risk an A/B
# test on this candidate policy" question OPE answers in production.
run_id: ope_synthetic_v1
data_path: null
n_synthetic: 20000
n_features: 10
target_policy: uplift_policy   # uplift_policy | treat_all | treat_none | random
uplift_policy_path: results/uplift_synthetic_v1/policy.joblib
dm_train_fraction: 0.5
n_bootstrap: 500
random_state: 42
